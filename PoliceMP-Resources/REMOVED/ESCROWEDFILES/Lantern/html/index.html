<html>
	<head>
		<link rel="stylesheet" href="reset.css" type="text/css">
        <link rel="stylesheet" href="index.css" type="text/css">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script>
            var audioPlayer = null;
            // Listen for NUI Messages.
            window.addEventListener('message', function(event) {
                // Check for playSound transaction
                if (event.data.transactionType == "playSound") {
                
                  if (audioPlayer != null) {
                    audioPlayer.pause();
                  }

                  audioPlayer = new Audio("./sounds/" + event.data.transactionFile + ".ogg");
                  audioPlayer.volume = event.data.transactionVolume;
                  audioPlayer.play();

                }
            });
        </script>
	</head>
	<body>
		<div id="container">
      <img src="images/Lantern.png" id="img" />
      <input type="firstname" placeholder="First Name" id="firstname"/>
      <input type="secondname" placeholder="Second Name" id="secondname"/>
      <input type="dob" placeholder="Date Of Birth" id="dob"/>
      <button id="submit" type="submit" class="submit btn-shock py-3 px-4 center">Submit</button>
      <button id="abort" type="submit" class="abort btn-shock py-3 px-4 center">Not on PNC</button>
		</div>
    <div id="container2">
      <img src="images/LanternTwo.png" id="img" />
      <button id="skip" type="submit" class="btn btn-shock py-3 px-4 center">Skip</button>
      <button id="retry" type="submit" class="btn2 btn-shock py-3 px-4 center">Retry</button>
      <button id="next" type="submit" class="btn3 btn-shock py-3 px-4 center">Next</button>
		</div>
        <script src="./index.js" type="text/javascript"></script>
	</body>
</html>
