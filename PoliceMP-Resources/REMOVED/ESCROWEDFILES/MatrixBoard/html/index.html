<html>
    <title>Matrix Board Script</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.1/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
</html>
<body>
    <div id="topHolder">
        <button id="options" class="btn closeButton" data-id="close"><i class="fa-solid fa-xmark"></i></button>
        <i class="fa-solid fa-building-shield"></i> Matrix Message Editor
    </div>
    <div id="mainHolderOuter">
        <div id="mainHolder">
            <fieldset>
                <legend>Preview</legend>

                <div id="matrix" class="hideText">
                    Collision Ahead
                </div>
            </fieldset>
            
            <fieldset style="text-align: center;">
                <legend style="text-align: left;">Options</legend>
                <button id="options" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i></button>
                <button id="options" class="btn btn-primary" data-id="up"><i class="fa-solid fa-arrow-up"></i></button>
                <button id="options" class="btn btn-primary" data-id="down"><i class="fa-solid fa-arrow-down"></i></button>
                <button id="options" class="btn btn-danger" data-id="power"><i class="fa-solid fa-power-off"></i></button>
                <button id="options" class="btn btn-primary" data-id="sun"><i class="fa-solid fa-sun"></i></button>
                <button id="options" class="btn btn-primary" data-id="doubleArrow"><i class="fa-solid fa-keyboard"></i></button>
                <button id="options" class="btn btn-primary" data-id="cycle"><i class="fa-solid fa-lightbulb"></i></button>
            </fieldset>
            
            <fieldset style="text-align: center;">
                <legend style="text-align: left;">Pre-Made Options</legend>
                <div id="list">
                    <span class="list">Collision Ahead</span>
                    <span class="list">Do Not Pass</span>
                    <span class="list">Follow Me</span>
                    <span class="list">Keep Left</span>
                    <span class="list">Keep Right</span>
                    <span class="list">Left Arrow</span>
                    <span class="list">Right Arrow</span>
                    <span class="list">Road Cloased</span>
                    <span class="list">Slow Down</span>
                    <span class="list">Stop</span>
                    <span class="list">Thank You</span>
                    <span class="list">Fog</span>
                </div>
            </fieldset>
        </div>
    </div>
</body>

<script>

    function display(bool) {

    if(bool){
        $("body").show()
    }else{
        $('body').hide()
    }
    }

    display(false)

    window.addEventListener('message', function(evt) {
        var item = evt.data;
        if (item.bool){
            display(true)
        }
        else{
            display(false)
        }
    })

    var type = ["Collision Ahead", "Do Not Pass", "Follow Me", "Keep Left", "Keep Right", "Left Arrows", "Right Arrows", "Road Closed", "Slow Down", "Stop", "Thank You", "Fog"]
    var sun = false
    var power = false
    var cycle = false

    function setList(){

        var generatedHtml2 = '';
        var index = 1;

        type.forEach(function (entry) {
            if (index == 1) { 
                generatedHtml2 = generatedHtml2 + ' <span class="list selected">' + entry + '</span> ';
            }
            else{
                generatedHtml2 = generatedHtml2 + ' <span class="list">' + entry + '</span> ';
            }

            index++;
        });
        $('#list').html(generatedHtml2);
        $('#matrix').removeClass("hideText")
        $('#matrix').html(type[0]);
    }


    setInterval(function () {
        if(sun){
            var x = document.getElementsByClassName("list");
            for(var i=0; i < x.length; i++){
                if(x[i].className == "list selected"){
                    $('#matrix').html(x[i].innerHTML);
                    $('#matrix').removeClass("hideText")
                    setTimeout(() => { $('#matrix').addClass("hideText"); }, 750);
                }
            }
        }else if(power){
            $('#matrix').removeClass("hideText")
        }
    }, 1500);

    setInterval(function () {
        if(cycle){
            var firstText = ""
            var secondText = ""
            var x = document.getElementsByClassName("list");
            for(var i=0; i < x.length; i++){
                if(x[i].className == "list selected"){
                    firstText = x[i].innerHTML
                }
                if(x[i].className == "list selectedOther"){
                    secondText = x[i].innerHTML
                }
            }
            $('#matrix').html(firstText)
            setTimeout(() => { $('#matrix').html(secondText); }, 750);
        }else if(power){
            var x = document.getElementsByClassName("list");
            for(var i=0; i < x.length; i++){
                if(x[i].className == "list selected"){
                    $('#matrix').html(x[i].innerHTML)
                }
            }
        }
    }, 1500);

    $('#list').hide()

    $('.btn').on('click', function(evt) {
        var dataText = $(this).attr("data-id")
        console.log(dataText)
        if(dataText == "power"){
            if(!power){
                $(this).addClass("optionsSelected")
                $('#list').show()
                setList()
            }else{
                $('#list').hide()
                $('#matrix').addClass("hideText");
                cycle = false
                sun = false
            }
            power = !power
        } else if(dataText == "down" && power){
            var x = document.getElementsByClassName("list");
            for(var i = 0; i < x.length; i++){
                if(x[i].className == "list selected"){
                    break
                }
            }
            if(!cycle){
                if(i+1 != x.length){
                    x[i].className = "list"
                    x[i+1].className = "list selected"
                    $('#matrix').html(x[i+1].innerHTML);
                }
            }
            else{
                y = document.getElementsByClassName("list");
                for(var z = 0; z < y.length; z++){
                    if(y[z].className == "list selectedOther"){
                        if(z+1 != x.length){
                            if(y[z+1].className == "list selected"){
                                if(z+2 < x.length){
                                    y[z].className = "list"
                                    y[z+2].className = "list selectedOther"
                                }
                                break
                            }
                            y[z].className = "list"
                            y[z+1].className = "list selectedOther"
                            break
                        }
                    }
                }
            }
        }
        else if(dataText == "up" && power){
            var x = document.getElementsByClassName("list");
            for(var i = 0; i < x.length; i++){
                if(x[i].className == "list selected"){
                    break
                }
            }
            if(!cycle){
                if(i-1 >= 0){
                    x[i].className = "list"
                    x[i-1].className = "list selected"
                    $('#matrix').html(x[i-1].innerHTML);
                }
            }
            else{
                y = document.getElementsByClassName("list");
                for(var z = 0; z < y.length; z++){
                    if(y[z].className == "list selectedOther"){
                        if(z-1 >= 0){
                            if(y[z-1].className == "list selected"){
                                if(z-2 >= 0){
                                    y[z].className = "list"
                                    y[z-2].className = "list selectedOther"
                                }
                                break
                            }
                            y[z].className = "list"
                            y[z-1].className = "list selectedOther"
                            break
                        }
                    }
                }
            }
        }else if(dataText == "sun" && power && !cycle){
            if(sun){
                $(this).removeClass("buttonSelect")
            }else{
                $(this).addClass("buttonSelect")
            }
            sun = !sun
        }else if(dataText == "cycle" && power && !sun){
            if(!cycle){
                $(this).addClass("buttonSelect")
                var x = document.getElementsByClassName("list");
                for(var i=0; i < x.length; i++){
                    if(x[i].className == "list selected"){
                        if(i+1 != x.length){
                            x[i+1].className ="list selectedOther"
                            break
                        }else{
                            x[i-1].className = "list selectedOther"
                            break
                        }
                    }
                }
            }else{
                $(this).removeClass("buttonSelect")
                var x = document.getElementsByClassName("list");
                for(var i=0; i < x.length; i++){
                    if(x[i].className == "list selectedOther"){
                        x[i].className ="list"
                        break
                    }
                }
            }
            cycle = !cycle
        }else if(dataText == "doubleArrow" && power){
            $.post('http://MatrixBoard/SubmitOwn')
        }else if(dataText == "close"){
            console.log("hello")
            var x = document.getElementsByClassName("list");
            var selected
            var selectedOther

            if(!power){
                $.post('http://MatrixBoard/PowerOff', JSON.stringify({}));
            }

            if(!cycle && power){
                for(var i = 0; i < x.length; i++){
                    if(x[i].className == "list selected"){
                        selected = i+1
                        break
                    }
                }
                $.post('http://MatrixBoard/ToggleLights', JSON.stringify({
                    index: selected,
                    type: "Normal"
                }));
            }

            if(sun && power){
                for(var i = 0; i < x.length; i++){
                    if(x[i].className == "list selected"){
                        selected = i+1
                        break
                    }
                }
                $.post('http://MatrixBoard/ToggleLights', JSON.stringify({
                    index: selected,
                    type: "Flash"
                }));

            }else if(cycle && power){
                for(var i = 0; i < x.length; i++){
                    if(x[i].className == "list selected"){
                        selected = i+1
                        break
                    }
                }

                for(var i = 0; i < x.length; i++){
                    if(x[i].className == "list selectedOther"){
                        selectedOther = i+1
                        break
                    }
                }

                $.post('http://MatrixBoard/ToggleLights', JSON.stringify({
                    index: selected,
                    indexTwo: selectedOther,
                    type: "Switch"
                }));
            }
        }
    })
</script>
