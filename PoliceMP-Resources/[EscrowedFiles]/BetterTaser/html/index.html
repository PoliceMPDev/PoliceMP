<html>

<head>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js" integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka" rel="stylesheet">
    <script>
        var audioPlayerLoop = null;
        var audioPlayer = null;
        window.addEventListener('message', function(event) {
            if (event.data.submissionType == "sendSound") {
                if (event.data.loop == null || event.data.loop == "false") {
                    event.data.loop = false;
                }
                if (event.data.loop == "true") {
                    event.data.loop = true;
                }
                if (audioPlayer != null && event.data.loop == false) {
                    audioPlayer.pause();
                }
                if (audioPlayerLoop != null && event.data.loop == true) {
                    audioPlayerLoop.loop(false);
                    audioPlayerLoop.stop();
                    audioPlayerLoop.unload();
                    audioPlayerLoop = null;
                    return;
                }
                if (event.data.loop == true) {
                    audioPlayerLoop = new Howl({
                        src: ["./sounds/" + event.data.submissionFile + ".ogg"],
                        loop: true,
                    });
                    audioPlayerLoop.volume(event.data.submissionVolume);
                    audioPlayerLoop.play();
                } else {
                    audioPlayer = new Howl({
                        src: ["./sounds/" + event.data.submissionFile + ".ogg"],
                    });
                    audioPlayer.volume(event.data.submissionVolume);
                    audioPlayer.play();
                }
            }

            if (event.data.submissionType == "x2taser") {
                if (event.data.cartridge != 0) {
                    if (event.data.cartridge == 1) {
                        if (event.data.cartridgeChange == "fired") {
                            document.getElementById("x2cartridgeleft").src = "img/x2_25ft_fired.png";
                        }
                        if (event.data.cartridgeChange == "selected") {
                            document.getElementById("x2cartridgeleft").src = "img/x2_25ft_selected.png";
                        }
                        if (event.data.cartridgeChange == "normal") {
                            document.getElementById("x2cartridgeleft").src = "img/x2_25ft.png";
                        }
                    }

                    if (event.data.cartridge == 2) {
                        if (event.data.cartridgeChange == "fired") {
                            document.getElementById("x2cartridgeright").src = "img/x2_25ft_fired.png";
                        }
                        if (event.data.cartridgeChange == "selected") {
                            document.getElementById("x2cartridgeright").src = "img/x2_25ft_selected.png";
                        }
                        if (event.data.cartridgeChange == "normal") {
                            document.getElementById("x2cartridgeright").src = "img/x2_25ft.png";
                        }
                    }
                } else {
                    if (event.data.show == 0) {
                        document.getElementById("x2CID").style = "display: none";
                    } else {
                        document.getElementById("x2CID").style = "display: block";
                    }
                    if (event.data.changebattery == 1) {
                        if (event.data.batterylevel >= 0 && event.data.batterylevel <= 20) {
                            document.getElementById("x2battery").src = "img/x2_battery_20.png";
                            document.getElementById("x2changebattery").style = "display: block";
                        } else {
                            document.getElementById("x2changebattery").style = "display: none";
                        }
                        if (event.data.batterylevel >= 21 && event.data.batterylevel <= 40) {
                            document.getElementById("x2battery").src = "img/x2_battery_40.png";
                        }
                        if (event.data.batterylevel >= 41 && event.data.batterylevel <= 60) {
                            document.getElementById("x2battery").src = "img/x2_battery_60.png";
                        }
                        if (event.data.batterylevel >= 61 && event.data.batterylevel <= 80) {
                            document.getElementById("x2battery").src = "img/x2_battery_80.png";
                        }
                        if (event.data.batterylevel >= 81 && event.data.batterylevel <= 100) {
                            document.getElementById("x2battery").src = "img/x2_battery_full.png";
                        }
                    }

                    if (event.data.changesafety == 1) {
                        if (event.data.safety == 1) {
                            document.getElementById("x2changebattery").style = "display: none";
                            document.getElementById("x2cartridgeleft").style = "display: none";
                            document.getElementById("x2cartridgeright").style = "display: none";
                            document.getElementById("x2battery").style = "display: none";
                            document.getElementById("x2batterygood").style = "display: none";
                            document.getElementById("x2semiauto").style = "display: none";
                        } else {
                            document.getElementById("x2cartridgeleft").style = "display: block";
                            document.getElementById("x2cartridgeright").style = "display: block";
                            document.getElementById("x2battery").style = "display: block";
                            document.getElementById("x2batterygood").style = "display: block";
                            document.getElementById("x2semiauto").style = "display: block";
                        }
                    }


                    if (event.data.show3 == 1) {
                        document.getElementById("x2no3").style = "display: block";
                        document.getElementById("x2cartridgeleft").style = "display: none";
                        document.getElementById("x2battery").style = "display: block";
                        document.getElementById("x2cartridgeright").style = "display: none";
                        document.getElementById("x2batterygood").style = "display: block";
                        document.getElementById("x2semiauto").style = "display: block";

                        if (event.data.shownumber == 1) {
                            document.getElementById("x2no3").src = "img/x2_1sec.png";
                        }
                        if (event.data.shownumber == 2) {
                            document.getElementById("x2no3").src = "img/x2_2sec.png";
                        }
                        if (event.data.shownumber == 3) {
                            document.getElementById("x2no3").src = "img/x2_3sec.png";
                        }
                    } else if (event.data.show3 == 2) {
                        document.getElementById("x2cartridgeleft").style = "display: block";
                        document.getElementById("x2cartridgeright").style = "display: block";
                        document.getElementById("x2no3").style = "display: none";
                        document.getElementById("x2battery").style = "display: block";
                        document.getElementById("x2batterygood").style = "display: block";
                        document.getElementById("x2semiauto").style = "display: block";
                    }
                }

            }
        });

    </script>
</head>

<body>


    <div id="x2CID" class="x2CID">
        <img id="x2battery" class="x2battery" src="img/x2_battery_full.png" />

        <img id="x2cartridgeleft" class="x2cartridgeleft" src="img/x2_25ft_selected.png" />
        <img id="x2cartridgeright" class="x2cartridgeright" src="img/x2_25ft.png" />

        <img id="x2semiauto" class="x2semiauto" src="img/x2_semiauto.png" />

        <img id="x2changebattery" class="x2changebattery" src="img/x2_lowbattery.png" />

        <img id="x2no3" class="x2no3" src="img/x2_3sec.png" />

        <img id="x2batterygood" class="x2batterygood" src="img/x2_goodbat.png" />
    </div>

</body>

</html>


<style>
    .x2CID {
        position: absolute;
        display: none;
        right: 2%;
        top: 2%;
        background-color: rgb(0, 0, 0, 0.8);
        height: 13vh;
        width: 30vh;
        border-radius: 10px;
    }
    
    .x2batterygood {
        position: absolute;
        display: none;
        height: 37%;
        width: auto;
        top: 1%;
        left: 1%;
    }
    
    .x2changebattery {
        display: none;
        position: absolute;
        height: 27%;
        width: auto;
        top: 77%;
        right: 33%;
        animation: blinker 1.5s step-start infinite;
    }
    
    @keyframes blinker {
        50% {
            opacity: 0;
        }
    }
    
    .x2no3 {
        display: none;
        position: absolute;
        height: 80%;
        width: auto;
        top: 10%;
        right: 30%;
    }
    
    .x2cartridgeright {
        position: absolute;
        display: none;
        height: 105%;
        width: auto;
        top: 2%;
        right: 13%;
    }
    
    .x2cartridgeleft {
        position: absolute;
        display: none;
        height: 105%;
        width: auto;
        top: 2%;
        left: 13%;
    }
    
    .x2battery {
        position: absolute;
        display: none;
        height: 50%;
        width: auto;
        top: 50%;
        right: -1%;
    }
    
    .x2semiauto {
        position: absolute;
        display: none;
        height: 70%;
        width: auto;
        top: 50%;
        left: -4%;
    }
    
</style>
