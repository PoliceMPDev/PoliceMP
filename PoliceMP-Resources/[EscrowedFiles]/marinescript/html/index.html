<html>

<head>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js" integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka" rel="stylesheet">
    <script>
        var audioPlayerLoop = null;
        var audioPlayer = null;
        window.addEventListener('message', function(event) {
            if (event.data.submissionType == "sendSound") {
                if (event.data.loop == null || event.data.loop == "false") {
                    event.data.loop = false;
                }
                if (event.data.loop == "true") {
                    event.data.loop = true;
                }
                if (audioPlayer != null && event.data.loop == false) {
                    audioPlayer.pause();
                }
                if (audioPlayerLoop != null && event.data.loop == true) {
                    audioPlayerLoop.loop(false);
                    audioPlayerLoop.stop();
                    audioPlayerLoop.unload();
                    audioPlayerLoop = null;
                    return;
                }
                if (event.data.loop == true) {
                    audioPlayerLoop = new Howl({
                        src: ["./sounds/" + event.data.submissionFile + ".ogg"],
                        loop: true,
                    });
                    audioPlayerLoop.volume(event.data.submissionVolume);
                    audioPlayerLoop.play();
                } else {
                    audioPlayer = new Howl({
                        src: ["./sounds/" + event.data.submissionFile + ".ogg"],
                    });
                    audioPlayer.volume(event.data.submissionVolume);
                    audioPlayer.play();
                }
            }
        

            if (event.data.submissionType == "boatUI") {
                if (event.data.enable == "true") {
                    document.getElementById("gpscanvas").classList.remove("gpscanvashide");
                    document.getElementById("knots").innerHTML = event.data.knots;
                    document.getElementById("heading").innerHTML = event.data.heading;
                    document.getElementById("heightASL").innerHTML = event.data.hasl;
                    document.getElementById("latitude").innerHTML = event.data.latitude;
                    document.getElementById("longitude").innerHTML = event.data.longitude;
                    document.getElementById("time").innerHTML = event.data.time;
                    document.getElementById("compass").innerHTML = event.data.compass;
                    document.getElementById("anchor").innerHTML = event.data.anchor;
                    document.getElementById("gps").classList.add("gpsShow");
                    if (event.data.anchor == "true") {
                        document.getElementById("anchor").classList.remove("anchorFalse");
                        document.getElementById("anchor").classList.add("anchorTrue");
                        document.getElementById("anchor").innerHTML = "ANCHOR";
                    } else {
                        document.getElementById("anchor").classList.remove("anchorTrue");
                        document.getElementById("anchor").classList.add("anchorFalse");
                        document.getElementById("anchor").innerHTML = "ANCHOR";
                    }

                }
                if (event.data.enable == "false") {
                    document.getElementById("gpscanvas").classList.add("gpscanvashide");
                }
            }
            if (event.data.submissionType == "diverHUD") {
                if (event.data.enable == "false") {
                    document.getElementById("diverhud").classList.add("diverhudhide");
                }
                if (event.data.enable == "true") {
                    document.getElementById("depth").innerHTML = event.data.depth;
                    document.getElementById("divetime").innerHTML = event.data.divetime;
                    document.getElementById("diverhud").classList.remove("diverhudhide");
                    document.getElementById("air").innerHTML = event.data.air;
                    document.getElementById("compassdir").innerHTML = event.data.compassdir;
                }
            }
            
        });

    </script>
</head>

<body>
    <div id="gpscanvas" class="gpscanvas gpscanvashide">

        <img id="gps" class="gps" src="https://i.imgur.com/BJF8llo.png" height="350" width="574">

        <p id="knots" class="knots"></p><br>
        <p id="heading" class="heading"></p><br>
        <p id="heightASL" class="heightASL"></p><br>

        <p id="time" class="time"></p><br>
        <p id="compass" class="compass"></p><br>

        <p id="latitude" class="coords1"></p>
        <p id="longitude" class="coords2"></p>

        <p id="anchor" class="anchor"></p>

    </div>

    <div id="diverhud" class="diverhud diverhudhide">

        <img id="diverimg" class="diverimg" src="https://i.imgur.com/NZCdUbM.png">
        <p id="depth" class="depth"></p>
        <p id="divetime" class="divetime"></p>
        <p id="air" class="air"></p>
        <p id="compassdir" class="compassdir"></p>

    </div>

</body>
