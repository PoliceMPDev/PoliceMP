<html>
<head>
    <link rel="stylesheet" href="reset.css" type="text/css">
    <link rel="stylesheet" href="index.css" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
</head>
<body>

    <div id="container">
        <form class="row flex-spaces" id="notepad">
            <input class="input-block" id="form" placeholder="Type your note here..."></input>
            <button class="border-success" id="submit" type="submit">Save and Exit</button>
            <button class="border-danger" id="clear" type="submit">Clear</button>
        </form>
        <div id="datetime"></div> <!-- Element to display the date and time -->
        <br>
        <ul id="notes"></ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js" type="text/javascript"></script>
    <script src="./main.js" type="text/javascript"></script>
</body>
</html>
