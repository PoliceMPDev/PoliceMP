<!DOCTYPE html>
<html lang="en">
	<head>
		<script src="nui://game/ui/jquery.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>NativeMods</title>
		<link rel="preload" href="https://pro.fontawesome.com/releases/v5.15.2/css/all.css" as="style"/>
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.2/css/all.css"/>

		<link rel="stylesheet" href="css/explosives.css" />
	</head>
	<body>

		<section id="explosives">
			<div id="explosives_int">
				<section id="explosives_cables">
					<img onclick="attempt_cut()" class="wire" src="./images/black.png" style="transform: skewY(20deg);margin-top:20%;">
					<img onclick="attempt_cut()" class="wire" src="./images/brown.png" style="transform: skewY(20deg);">
					<img onclick="attempt_cut()" class="wire" src="./images/blue.png" style="transform: skewY(-30deg);">
					<img onclick="attempt_cut()" class="wire" src="./images/yellow.png" style="transform: skewY(10deg);">
				</section>
				<section id="explosives_code">
					<div id="display">&nbsp;</div><hr>
					<span id="closeButton">X</span>
					<button onclick="explosive_btn_press('7')">7</button>
					<button onclick="explosive_btn_press('8')">8</button>
					<button onclick="explosive_btn_press('9')">9</button><br>
					<button onclick="explosive_btn_press('4')">4</button>
					<button onclick="explosive_btn_press('5')">5</button>
					<button onclick="explosive_btn_press('6')">6</button><br>
					<button onclick="explosive_btn_press('1')">1</button>
					<button onclick="explosive_btn_press('2')">2</button>
					<button onclick="explosive_btn_press('3')">3</button><br>
					<button onclick="explosive_btn_press('*')" style="font-weight:200;">✱</button>
					<button onclick="explosive_btn_press('0')">0</button>
					<button onclick="explosive_btn_press('#')">#</button>
					<br><br>
					<button style="padding: 3%;" onclick="attempt_disarm()">DISARM</button>
				</section>
			</div>
		</section>

	</body>
	<footer>
		<script src="js/explosives.js"></script>
	</footer>
</html>
