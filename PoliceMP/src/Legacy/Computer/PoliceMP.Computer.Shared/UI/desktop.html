<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://cdn.metroui.org.ua/v4/css/metro-all.min.css?ver=@@b-version" />
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">

    <link href="css/descktop.css" rel="stylesheet" />
    <link href="css/snake.css" rel="stylesheet" />

    <title>Police Computer</title>

    <style>
        .window-area {
            background: url("images/police_background.jpg") center center no-repeat;
            background-size: cover;
        }
        #charm {
            height: calc(100vh - 40px);
            width: 396px;
            background-color: #1F4F5D;
        }
    </style>
</head>
<body class="m4-cloak" style="display:none;">
    <div class="desktop">
        <div class="window-area">
            <div class="row fg-white text-center">
                <div class="cell-1">
                    <div onclick="calloutShowAll()" class="desktop-icon">
                        <i class="fa fa-phone-square"></i><br />
                        <span>Calls</span>
                    </div>
                </div>
                <div class="cell-1">
                    <div onclick="showGamesWindow()" class="desktop-icon">
                        <i class="fa fa-gamepad"></i><br />
                        <span>Games</span>
                    </div>
                </div>
                <div class="cell-1">
                    <div onclick="logout()" class="desktop-icon">
                        <i class="fa fa-sign-out"></i><br />
                        <span>Logout</span>
                    </div>
                </div>
            </div>

        </div>
        <div class="task-bar">
            <div class="task-bar-section">
                <button class="task-bar-item" id="start-menu-toggle"><span class="fa fa-shield"></span></button>
                <div class="start-menu" data-role="dropdown" data-toggle-element="#start-menu-toggle">
                    <div class="start-menu-inner h-100">
                        <div class="explorer">
                            <ul class="v-menu w-100 bg-brandColor2 fg-white">
                                <li><a onclick="calloutShowAll()">Calls</a></li>
                                <li><a onclick="showGamesWindow()">Games</a></li>
                                <li><a onclick="logout()">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="task-bar-section tasks"></div>
            <div class="task-bar-section system-tray ml-auto">
                <span style="line-height: 40px;" class="pr-8">
                    <span data-role="clock" class="w-auto fg-white reduce-1" data-show-date="false"></span>
                </span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.26.0/moment.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="js/metro.min.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/callouts.js"></script>
    <script src="js/games.js"></script>
    <script>
    </script>
    <!-- ads-script -->
</body>
</html>
