<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body style="display: none;">

<script src="..\Assets\jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
<script type="text/javascript">
    var audioPlayer = null;

    policemp.on('ready',
        () => {
            policemp.show();
        });

    policemp.on('playSound',
        (data) => {
            playAudio(data.fileName, data.volume);
        });

    policemp.on('playSoundFromLocation', (data) => {
        playAudioFromLocation(data.fileName, data.volume, data.listenerPosition, data.soundPosition, data.listenerRotation);
    });

    function playAudio(fileName, volume) {
        audioPlayer = new Howl({ src: [`Sounds/${fileName}`], volume: volume });
        audioPlayer.play();
    }

    function playAudioFromLocation(fileName, volume, listenerPosition, soundPosition, listenerRotation) {
        if (!fileName || !listenerPosition || !soundPosition || !listenerRotation) {
            console.error("Invalid parameters for spatial audio.");
            return;
        }

        // Create a new spatialized sound
        var spatialSound = new Howl({
            src: [`Sounds/${fileName}`],
            volume: volume,
            loop: false,
            autoplay: true,
            onload: () => console.log("Spatial sound loaded:", fileName)
        });

        // Set sound source position
        spatialSound.pos(soundPosition.x, soundPosition.y, soundPosition.z);

        // Set listener position
        Howler.pos(listenerPosition.x, listenerPosition.y, listenerPosition.z);

        // Apply listener orientation based on yaw (assuming 2D rotation for simplicity)
        //var yawRad = listenerRotation.yaw * (Math.PI / 180); // Convert degrees to radians
        // Howler.orientation(
        //    Math.cos(yawRad), 0, Math.sin(yawRad), // Forward vector
        //    0, 1, 0 // Up vector
        // );

        // Play the sound
        //spatialSound.play();
    }
    

</script>
</body>
</html>
